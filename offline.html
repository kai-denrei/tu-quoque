<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tu Quoque — offline</title>
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <style>
    body { display: grid; place-items: center; text-align: center; padding: 2rem; }
    .off { max-width: 44ch; }
    .off .mark { font-family: var(--mono); color: var(--glow); font-size: 2rem; letter-spacing: -.18em; }
    .off h1 { font-family: var(--display); font-size: var(--step-2); margin: .6rem 0; }
    .off p { color: var(--dim); }
    .off a { color: var(--teal); border-bottom: 1px solid var(--teal-dim); }
  </style>
</head>
<body>
  <div class="off">
    <div class="mark">◖◗</div>
    <h1>You're offline</h1>
    <p>The atlas hasn't been cached on this device yet, or this view needs the network. Reconnect and <a href="./">return to the map</a>.</p>
  </div>
</body>
</html>
